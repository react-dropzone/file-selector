version: 2

updates:
  - package-ecosystem: npm
    directory: /
    rebase-strategy: auto
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    versioning-strategy: increase
    ignore:
      # Pinned to 1.0.0-beta.8: waku 1.0.0-beta.9 removed the router's
      # `unstable_events` API that vocs' ScrollRestoration still relies on,
      # which white-screens the docs site (regressed by #177). Unpin once
      # vocs ships a release compatible with a newer waku beta.
      - dependency-name: "waku"
    # Patch bumps grouped into one PR (auto-merged on green CI); minor bumps
    # grouped into a separate PR for manual review; majors open individually.
    # Exception: vitest and its plugins are locked to the same major, so a
    # split bump crashes coverage (#188, #189). Keep them in one group across
    # every update type; this group is first so it claims them before the
    # patch/minor catch-alls below.
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      patch:
        patterns:
          - "*"
        update-types:
          - patch
      minor:
        patterns:
          - "*"
        update-types:
          - minor
